# =============================================================================
#  VirtualHost de DESARROLLO para probar en este ordenador
#      http://local.tienda
#
#  Requiere haber anadido local.tienda y sus subdominios en /etc/hosts
#  (lo hace deploy/setup-local-domain.sh).
# =============================================================================

<VirtualHost *:80>
    ServerName local.tienda
    ServerAlias www.local.tienda *.local.tienda

    DocumentRoot /var/www/html/tienda

    <Directory /var/www/html/tienda>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # -------------------------------------------------------------------------
    # Rutas internas: NUNCA servidas por web (documentacion de agentes, codigo,
    # configuracion y datos). Refuerza lo que ya bloquea .htaccess, por si en el
    # futuro se reduce AllowOverride.
    # -------------------------------------------------------------------------
    <DirectoryMatch "^/var/www/html/tienda/(\.agents|\.git|app|config|database|deploy|storage|tools|vendor)(/|$)">
        Require all denied
    </DirectoryMatch>

    # El proyecto gestiona el enrutado con .htaccess + index.php
    <IfModule mod_rewrite.c>
        RewriteEngine On
    </IfModule>

    # PHP 8.4 con mod_php anade ";HttpOnly;Secure;SameSite=None" a las cookies,
    # lo que hace que en HTTP (sin TLS) el navegador DESCARTE la cookie de sesion.
    # Se elimina ese sufijo para que la sesion funcione en desarrollo.
    <IfModule mod_headers.c>
        Header edit "Set-Cookie" ";HttpOnly;Secure;SameSite=None" ""
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/local.tienda-error.log
    CustomLog ${APACHE_LOG_DIR}/local.tienda-access.log combined
</VirtualHost>
