# =============================================================================
#  Ejemplo de VirtualHost para la plataforma multi-tienda
#
#  Cubre:
#    - dominio principal de la plataforma (panel + tiendas por subdominio)
#    - subdominios de tienda            (*.ecom-era.com)
#    - dominios propios de las tiendas  (vhost catch-all + certificado on-demand)
#
#  Ajusta rutas, dominios y rutas de certificados antes de usar.
#
#  TLS: para que `prueba.ecom-era.com` cargue con HTTPS hace falta un
#  certificado wildcard que cubra el apex y `*.ecom-era.com` (el wildcard NO
#  cubre el apex):
#
#      sudo certbot certonly --dns-cloudflare \
#        --dns-cloudflare-credentials /root/.secrets/cloudflare.ini \
#        -d ecom-era.com -d '*.ecom-era.com' --cert-name ecom-era.com
#
#  y luego Apache usa /etc/letsencrypt/live/ecom-era.com/{fullchain,privkey}.pem.
#  Comprueba con:  curl -I https://prueba.ecom-era.com/
# =============================================================================

# -----------------------------------------------------------------------------
# HTTP -> HTTPS (incluye comodines de subdominio)
# -----------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName ecom-era.com
    ServerAlias www.ecom-era.com *.ecom-era.com

    # Dominios propios: catch-all para que resuelvan a este proyecto.
    ServerAlias *

    DocumentRoot /var/www/html/tienda

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# -----------------------------------------------------------------------------
# HTTPS principal + subdominios de tienda (certificado wildcard)
# -----------------------------------------------------------------------------
<VirtualHost *:443>
    ServerName ecom-era.com
    ServerAlias www.ecom-era.com *.ecom-era.com

    DocumentRoot /var/www/html/tienda

    <Directory /var/www/html/tienda>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Rutas internas: NUNCA servidas por web (documentacion de agentes, codigo,
    # configuracion y datos). Refuerza lo que ya bloquea .htaccess.
    <DirectoryMatch "^/var/www/html/tienda/(\.agents|\.git|app|config|database|deploy|storage|tools|vendor)(/|$)">
        Require all denied
    </DirectoryMatch>

    SSLEngine on
    # Certificado wildcard: cubre ecom-era.com y *.ecom-era.com.
    SSLCertificateFile    /etc/letsencrypt/live/ecom-era.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ecom-era.com/privkey.pem

    # Bloquea el acceso directo a ficheros sensibles
    <FilesMatch "\.(env|sql|md|log|json|lock|yml|yaml|sh|ini|bak|dist|example)$">
        Require all denied
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/tienda-error.log
    CustomLog ${APACHE_LOG_DIR}/tienda-access.log combined
</VirtualHost>

# -----------------------------------------------------------------------------
# Dominios propios de las tiendas (certificado on-demand con ACME)
#
#  Opcion A: usar un vhost catch-all con "ServerAlias *".
#  Opcion B: emitir certificado por dominio con:
#       certbot --apache -d mitienda.com -d www.mitienda.com
#  Opcion C (recomendada si hay muchos dominios): proxy inverso con
#       on-demand TLS (Caddy/nginx) delante de Apache.
# -----------------------------------------------------------------------------
<VirtualHost *:443>
    ServerName default.tienda.invalid
    ServerAlias *

    DocumentRoot /var/www/html/tienda

    <Directory /var/www/html/tienda>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Rutas internas: NUNCA servidas por web (ver nota en el vhost principal)
    <DirectoryMatch "^/var/www/html/tienda/(\.agents|\.git|app|config|database|deploy|storage|tools|vendor)(/|$)">
        Require all denied
    </DirectoryMatch>

    # Los dominios no verificados NO se sirven (el resolver devuelve 404/lading).
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/default/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/default/privkey.pem
</VirtualHost>
